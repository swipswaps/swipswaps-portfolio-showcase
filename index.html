<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>swipswaps · 3D Portfolio Tag Cloud</title>
    <meta name="description" content="Jose Melendez - DevOps Data Scientist & AI-Augmented Reliability Engineer">
    
    <!-- Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #050b1a 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header - Fixed, not overlapping 3D canvas */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(16px);
            padding: 16px 24px;
            z-index: 100;
            border-bottom: 1px solid rgba(94, 255, 224, 0.2);
        }
        
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
        }
        
        .header p {
            font-size: 0.8rem;
            color: #88aacc;
            margin-top: 4px;
        }
        
        /* Search Box */
        .search-container {
            position: fixed;
            top: 100px;
            left: 24px;
            right: 24px;
            max-width: 400px;
            z-index: 100;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            border: 1px solid rgba(94, 255, 224, 0.3);
            padding: 4px 16px 4px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            padding: 12px 0;
            outline: none;
            font-family: monospace;
        }
        
        .search-container input::placeholder {
            color: #666;
        }
        
        .search-container .search-icon {
            color: #5effe0;
            font-size: 18px;
        }
        
        .search-container .clear-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .search-container .clear-btn:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        /* Stats Panel */
        .stats-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            max-width: 380px;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px 20px;
            z-index: 100;
            border: 1px solid rgba(94, 255, 224, 0.2);
            pointer-events: none;
        }
        
        .stats-panel .stats {
            display: flex;
            gap: 24px;
            margin-top: 8px;
            font-size: 12px;
            color: #88aacc;
            font-family: monospace;
        }
        
        .stats-panel .badge {
            display: inline-block;
            background: rgba(94, 255, 224, 0.15);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            color: #5effe0;
            margin-top: 8px;
        }
        
        /* Controls hint */
        .controls-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            color: #888;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        
        /* Social links */
        .social-links {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .social-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
            background: rgba(8, 12, 20, 0.8);
            padding: 8px 16px;
            border-radius: 40px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .social-links a:hover {
            color: #5effe0;
            border-color: #5effe0;
        }
        
        /* Loading indicator */
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 16px 32px;
            border-radius: 60px;
            color: #5effe0;
            font-family: monospace;
            z-index: 200;
            border: 1px solid #5effe0;
            white-space: nowrap;
        }
        
        /* Filtered count indicator */
        .filter-count {
            display: inline-block;
            margin-left: 12px;
            font-size: 11px;
            background: rgba(94, 255, 224, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
        }
        
        @media (max-width: 700px) {
            .header { padding: 12px 16px; }
            .header h1 { font-size: 1rem; }
            .search-container { top: 85px; left: 16px; right: 16px; max-width: none; }
            .stats-panel { left: 16px; right: 16px; max-width: none; bottom: 16px; }
            .controls-hint { bottom: 12px; right: 12px; font-size: 9px; }
            .social-links { top: 12px; right: 12px; }
            .social-links a { padding: 5px 12px; font-size: 11px; }
        }
        
        /* Tag cloud canvas container */
        #tag-cloud-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>José Melendez</h1>
        <p>DevOps Data Scientist · AI-Augmented Reliability Engineer</p>
    </div>
    
    <div class="social-links">
        <a href="https://github.com/swipswaps" target="_blank">GitHub</a>
        <a href="https://x.com/swipswaps" target="_blank">X/Twitter</a>
    </div>
    
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Filter repositories by name..." autocomplete="off">
        <button class="clear-btn" id="clear-search" style="display: none;">✕</button>
    </div>
    
    <div class="stats-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <span style="font-weight: 600; color: #5effe0;">✨ swipswaps Portfolio</span>
            <span class="badge" id="data-badge">Loading...</span>
        </div>
        <div class="stats">
            <span>📦 <span id="total-count">—</span> repos</span>
            <span>⭐ <span id="star-count">—</span> stars</span>
            <span>🎯 <span id="visible-count">—</span> visible</span>
        </div>
    </div>
    <div class="controls-hint">🖱️ Drag to rotate • Hover for details • Click to open</div>
    
    <div id="tag-cloud-container"></div>
    <div id="loader">🌀 loading 3D tag cloud...</div>

    <!-- Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-tag-cloud@1.0.2/dist/three-tag-cloud.min.js"></script>

    <script>
        // Repository data
        let allRepos = [];
        let currentCloud = null;
        let usingLiveData = false;
        let currentFilter = '';
        
        // Fallback data (your actual repos from the screenshot)
        const FALLBACK_REPOS = [
            { name: "callback-platform", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/callback-platform", date: "2026-05-15" },
            { name: "firefox_fix", language: "Shell", stars: 0, url: "https://github.com/swipswaps/firefox_fix", date: "2026-05-14" },
            { name: "ice-tuner", language: "Python", stars: 0, url: "https://github.com/swipswaps/ice-tuner", date: "2026-05-12" },
            { name: "conversation-search", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/conversation-search", date: "2026-05-10" },
            { name: "Master-FB", language: "Python", stars: 0, url: "https://github.com/swipswaps/Master-FB", date: "2026-05-08" },
            { name: "balloon-color-plan", language: "JavaScript", stars: 0, url: "https://github.com/swipswaps/balloon-color-plan", date: "2026-05-07" },
            { name: "lossless-ffmpeg-concat", language: "Shell", stars: 0, url: "https://github.com/swipswaps/lossless-ffmpeg-concat", date: "2026-05-05" },
            { name: "Masterclass-TUI", language: "Python", stars: 0, url: "https://github.com/swipswaps/Masterclass-TUI", date: "2026-05-03" },
            { name: "controller-Unified", language: "C", stars: 0, url: "https://github.com/swipswaps/controller-Unified", date: "2026-05-01" },
            { name: "parachute-cfd-game", language: "GDScript", stars: 0, url: "https://github.com/swipswaps/parachute-cfd-game", date: "2026-04-28" },
            { name: "deterministic-Network", language: "Python", stars: 0, url: "https://github.com/swipswaps/deterministic-Network", date: "2026-04-25" },
            { name: "bcm4331-folder", language: "Shell", stars: 0, url: "https://github.com/swipswaps/bcm4331-folder", date: "2026-04-22" },
            { name: "Video-Insight-Server", language: "Python", stars: 0, url: "https://github.com/swipswaps/Video-Insight-Server", date: "2026-04-20" },
            { name: "Pro-Vista", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/Pro-Vista", date: "2026-04-18" },
            { name: "GEMMA_4", language: "Python", stars: 0, url: "https://github.com/swipswaps/GEMMA_4", date: "2026-04-15" },
            { name: "sys-inspector", language: "Python", stars: 0, url: "https://github.com/swipswaps/sys-inspector", date: "2026-04-12" },
            { name: "storyboard-studio", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/storyboard-studio", date: "2026-04-10" },
            { name: "observability-platform", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/observability-platform", date: "2026-05-18" },
            { name: "vscode-llm-multi-provider", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/vscode-llm-multi-provider", date: "2026-05-20" }
        ];
        
        async function fetchRepos() {
            const loader = document.getElementById('loader');
            try {
                const response = await fetch('https://api.github.com/users/swipswaps/repos?sort=pushed&direction=desc&per_page=50');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        allRepos = data.map(repo => ({
                            name: repo.name,
                            language: repo.language || 'Unknown',
                            stars: repo.stargazers_count || 0,
                            url: repo.html_url,
                            date: repo.pushed_at.slice(0, 10)
                        }));
                        usingLiveData = true;
                        document.getElementById('data-badge').textContent = '✓ Live GitHub API';
                        document.getElementById('data-badge').style.color = '#5effe0';
                        if (loader) loader.style.opacity = '0';
                        setTimeout(() => loader?.remove(), 500);
                        updateStats();
                        createTagCloud();
                        return;
                    }
                }
                throw new Error('API failed');
            } catch (err) {
                console.log('Using fallback data');
                allRepos = [...FALLBACK_REPOS];
                usingLiveData = false;
                document.getElementById('data-badge').textContent = '📦 Sample Data';
                document.getElementById('data-badge').style.color = '#ffaa44';
                if (loader) loader.style.opacity = '0';
                setTimeout(() => loader?.remove(), 500);
                updateStats();
                createTagCloud();
            }
        }
        
        function updateStats() {
            document.getElementById('total-count').textContent = allRepos.length;
            const totalStars = allRepos.reduce((sum, r) => sum + (r.stars || 0), 0);
            document.getElementById('star-count').textContent = totalStars;
        }
        
        function getRepoColor(lang) {
            const colors = {
                'JavaScript': '#f7df1e', 'TypeScript': '#3178c6', 'Python': '#3572A5',
                'Shell': '#89e051', 'HTML': '#e34c26', 'CSS': '#563d7c',
                'GDScript': '#478cbf', 'Go': '#00ADD8', 'Rust': '#dea584',
                'Unknown': '#888888', 'C': '#555555'
            };
            return colors[lang] || '#44aaff';
        }
        
        function createTagCloud() {
            const container = document.getElementById('tag-cloud-container');
            if (!container) return;
            
            // Clear previous
            container.innerHTML = '';
            
            // Filter repos based on search
            let filteredRepos = allRepos;
            if (currentFilter) {
                filteredRepos = allRepos.filter(repo => 
                    repo.name.toLowerCase().includes(currentFilter.toLowerCase())
                );
            }
            document.getElementById('visible-count').textContent = filteredRepos.length;
            
            if (filteredRepos.length === 0) {
                container.innerHTML = '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;">No matching repositories</div>';
                return;
            }
            
            // Format entries for tag cloud
            const entries = filteredRepos.map(repo => ({
                label: repo.name,
                url: repo.url,
                target: '_blank',
                // Store metadata for hover
                tooltip: `${repo.language} · ⭐ ${repo.stars} stars · Updated: ${repo.date}`
            }));
            
            // Initialize the 3D tag cloud - this library handles all positioning!
            try {
                $('#tag-cloud-container').svg3DTagCloud({
                    entries: entries,
                    width: window.innerWidth,
                    height: window.innerHeight,
                    radius: '70%',
                    radiusMin: 80,
                    bgDraw: false,
                    opacityOver: 1.0,
                    opacityOut: 0.7,
                    opacitySpeed: 6,
                    fov: 800,
                    speed: 2,
                    fontFamily: "'Inter', system-ui, sans-serif",
                    fontSize: '18px',
                    fontColor: '#ffffff',
                    fontWeight: '500',
                    fontStyle: 'normal',
                    fontStretch: 'normal',
                    fontToUpperCase: false
                });
                
                // Add custom hover tooltips (since the library doesn't have built-in tooltips)
                setTimeout(() => {
                    const svgElements = document.querySelectorAll('#tag-cloud-container svg a text');
                    svgElements.forEach((el, idx) => {
                        const repo = filteredRepos[idx];
                        if (repo && el.parentElement) {
                            el.parentElement.setAttribute('title', repo.tooltip);
                            // Style on hover
                            el.parentElement.addEventListener('mouseenter', () => {
                                updateInfoPanel(repo);
                            });
                        }
                    });
                }, 100);
                
            } catch (err) {
                console.error('Tag cloud error:', err);
                container.innerHTML = '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffaa44;">Error loading 3D view. Please refresh.</div>';
            }
        }
        
        function updateInfoPanel(repo) {
            const titleEl = document.querySelector('.stats-panel span:first-child');
            const descEl = document.querySelector('.stats-panel .stats');
            if (titleEl && descEl) {
                // We'll update the panel content temporarily
                const panel = document.querySelector('.stats-panel');
                const originalHTML = panel.innerHTML;
                
                panel.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                        <span style="font-weight: 600; color: #5effe0;">📁 ${repo.name}</span>
                        <span class="badge" style="background: ${getRepoColor(repo.language)}20; border-color: ${getRepoColor(repo.language)};">${repo.language}</span>
                    </div>
                    <div style="margin-top: 8px; font-size: 12px;">
                        ⭐ ${repo.stars} stars &nbsp;|&nbsp; 📅 ${repo.date}
                    </div>
                    <div class="badge" style="margin-top: 8px; cursor: pointer;" onclick="window.open('${repo.url}', '_blank')">🔗 Click to open GitHub →</div>
                `;
                
                // Restore after 3 seconds on mouse leave of the whole panel? 
                // Actually let's restore when mouse leaves the SVG
                const restoreTimeout = setTimeout(() => {
                    if (panel) {
                        panel.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                                <span style="font-weight: 600; color: #5effe0;">✨ swipswaps Portfolio</span>
                                <span class="badge" id="data-badge">${usingLiveData ? '✓ Live GitHub API' : '📦 Sample Data'}</span>
                            </div>
                            <div class="stats">
                                <span>📦 <span id="total-count">${allRepos.length}</span> repos</span>
                                <span>⭐ <span id="star-count">${allRepos.reduce((s,r)=>s+(r.stars||0),0)}</span> stars</span>
                                <span>🎯 <span id="visible-count">${document.getElementById('visible-count')?.textContent || allRepos.length}</span> visible</span>
                            </div>
                        `;
                    }
                }, 4000);
                
                // Store timeout to clear if needed
                if (window._restoreTimeout) clearTimeout(window._restoreTimeout);
                window._restoreTimeout = restoreTimeout;
            }
        }
        
        // Search functionality
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        
        searchInput.addEventListener('input', (e) => {
            currentFilter = e.target.value;
            clearBtn.style.display = currentFilter ? 'block' : 'none';
            createTagCloud(); // Recreate with filter
        });
        
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentFilter = '';
            clearBtn.style.display = 'none';
            createTagCloud();
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            createTagCloud();
        });
        
        // Initialize
        fetchRepos();
    </script>
</body>
</html>
