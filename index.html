<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swipswaps · 3D Portfolio & Code Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #050b1a 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(8,12,20,0.9);
            backdrop-filter: blur(16px);
            padding: 12px 24px;
            z-index: 100;
            border-bottom: 1px solid rgba(94,255,224,0.2);
        }
        .header h1 { font-size: 1.1rem; font-weight: 600; color: white; }
        .header p { font-size: 0.7rem; color: #88aacc; margin-top: 2px; }
        .social-links {
            position: fixed;
            top: 12px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        .social-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
            background: rgba(8,12,20,0.8);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .social-links a:hover { color: #5effe0; }
        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 100px;
        }
        .main-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            padding: 2rem;
        }
        .cloud-panel {
            flex: 2;
            min-width: 300px;
            background: rgba(8,12,20,0.4);
            border-radius: 24px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(94,255,224,0.2);
            overflow: hidden;
            position: relative;
            height: 70vh;
        }
        .search-panel {
            flex: 1;
            min-width: 320px;
            background: rgba(8,12,20,0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(94,255,224,0.3);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 70vh;
            overflow-y: auto;
        }
        .search-panel, .search-panel * { color: #e8edf5 !important; }
        .result-item {
            background: #0f0f1a !important;
            border-left: 2px solid #5effe0 !important;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .result-item .code-snippet {
            background: #00000066 !important;
            color: #e8edf5 !important;
            padding: 8px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 11px;
            max-height: 120px;
            overflow-y: auto;
        }
        .search-panel h2 { color: #5effe0 !important; font-size: 1.25rem; margin-bottom: 0.5rem; }
        .search-box { display: flex; gap: 8px; }
        .search-box input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 40px;
            padding: 10px 16px;
            color: white;
            font-family: monospace;
        }
        .search-box button {
            background: #5effe0;
            color: #0a0f1a;
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .status-online { background: #2e7d64; color: #5effe0 !important; }
        .status-offline { background: #5a2a2a; color: #ffaa88 !important; }
        .instructions {
            background: #0f0f1a;
            border-radius: 16px;
            padding: 1rem;
            font-family: monospace;
            font-size: 12px;
            margin-top: 1rem;
            border-left: 3px solid #5effe0;
        }
        .instructions code {
            display: block;
            background: #00000044;
            padding: 8px;
            border-radius: 8px;
            margin: 8px 0;
        }
        .search-results { display: flex; flex-direction: column; gap: 12px; margin-top: 1rem; }
        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        #canvas-container { width: 100%; height: 100%; }
        .controls-hint {
            position: fixed;
            bottom: 16px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            color: #aaa;
            z-index: 100;
        }
        @media (max-width: 800px) {
            .main-grid { flex-direction: column; padding: 1rem; }
            .cloud-panel { height: 50vh; }
            .search-panel { max-height: 50vh; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>José Melendez</h1>
    <p>DevOps Data Scientist · AI-Augmented Reliability Engineer</p>
</div>
<div class="social-links">
    <a href="https://github.com/swipswaps" target="_blank">GitHub</a>
    <a href="https://x.com/swipswaps" target="_blank">X/Twitter</a>
</div>
<div class="controls-hint">🖱️ Drag to rotate • Tap or double‑click repo to open</div>

<div class="container">
    <div class="main-grid">
        <div class="cloud-panel"><div id="canvas-container" style="width:100%; height:100%;"></div></div>
        <div class="search-panel">
            <h2>🔍 Repo Search</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Filter repos (e.g., fedora, observability)...">
                <button id="search-btn">Search</button>
            </div>
            <div id="local-results" class="search-results"></div>
            <div style="margin-top: 1rem; border-top: 1px solid #2a2a3e; padding-top: 1rem;">
                <h2>🔬 Code Search</h2>
                <div id="backend-status">⏳ Checking local backend...</div>
                <div class="search-box">
                    <input type="text" id="code-query" placeholder="Search code (requires local backend)" disabled>
                    <button id="code-search-btn" disabled>Search Code</button>
                </div>
                <div id="code-results" class="search-results"></div>
                <div id="instructions-panel" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================
    // SINGLE SOURCE OF TRUTH - Master repository list
    // ============================================================
    // This list is used for BOTH the 3D cloud AND client-side search.
    // It includes Fedora repos so search works immediately.
    const MASTER_REPOS = [
        { name: "observability-platform", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/observability-platform", date: "2026-05-18" },
        { name: "vscode-llm-multi-provider", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/vscode-llm-multi-provider", date: "2026-05-20" },
        { name: "sys-inspector", language: "Python", stars: 0, url: "https://github.com/swipswaps/sys-inspector", date: "2026-04-12" },
        { name: "parachute-cfd-game", language: "GDScript", stars: 0, url: "https://github.com/swipswaps/parachute-cfd-game", date: "2026-04-28" },
        { name: "bcm4331-self-healing", language: "Shell", stars: 0, url: "https://github.com/swipswaps/bcm4331-self-healing", date: "2026-04-22" },
        { name: "callback-platform", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/callback-platform", date: "2026-05-15" },
        { name: "firefox_fix", language: "Shell", stars: 0, url: "https://github.com/swipswaps/firefox_fix", date: "2026-05-14" },
        { name: "conversation-search", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/conversation-search", date: "2026-05-10" },
        { name: "bcm4331-fedora-offline-fix-UPGRADE", language: "Shell", stars: 0, url: "https://github.com/swipswaps/bcm4331-fedora-offline-fix-UPGRADE", date: "2026-05-01" },
        { name: "fedora-network-controller", language: "Python", stars: 0, url: "https://github.com/swipswaps/fedora-network-controller", date: "2026-04-25" },
        { name: "fedora-optimizer", language: "Shell", stars: 0, url: "https://github.com/swipswaps/fedora-optimizer", date: "2026-04-20" },
        { name: "Master-FB", language: "Python", stars: 0, url: "https://github.com/swipswaps/Master-FB", date: "2026-05-08" },
        { name: "balloon-color-plan", language: "JavaScript", stars: 0, url: "https://github.com/swipswaps/balloon-color-plan", date: "2026-05-07" },
        { name: "lossless-ffmpeg-concat", language: "Shell", stars: 0, url: "https://github.com/swipswaps/lossless-ffmpeg-concat", date: "2026-05-05" },
        { name: "Masterclass-TUI", language: "Python", stars: 0, url: "https://github.com/swipswaps/Masterclass-TUI", date: "2026-05-03" },
        { name: "controller-Unified", language: "C", stars: 0, url: "https://github.com/swipswaps/controller-Unified", date: "2026-05-01" },
        { name: "deterministic-Network", language: "Python", stars: 0, url: "https://github.com/swipswaps/deterministic-Network", date: "2026-04-25" },
        { name: "Video-Insight-Server", language: "Python", stars: 0, url: "https://github.com/swipswaps/Video-Insight-Server", date: "2026-04-20" },
        { name: "Pro-Vista", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/Pro-Vista", date: "2026-04-18" },
        { name: "GEMMA_4", language: "Python", stars: 0, url: "https://github.com/swipswaps/GEMMA_4", date: "2026-04-15" },
        { name: "storyboard-studio", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/storyboard-studio", date: "2026-04-10" }
    ];

    let allRepos = [...MASTER_REPOS];
    let tagSprites = [];
    let scene, camera, renderer, controls;
    let tooltipDiv;
    let interactionsAttached = false;

    // ============================================================
    // CLIENT-SIDE FUZZY SEARCH (works instantly, no backend needed)
    // ============================================================
    function fuzzySearchRepos(query) {
        if (!query || query.length < 2) return [];
        const lowerQuery = query.toLowerCase();
        return allRepos
            .map(repo => {
                let score = 0;
                const nameLower = repo.name.toLowerCase();
                if (nameLower.includes(lowerQuery)) score = 1.0;
                else if (repo.language.toLowerCase().includes(lowerQuery)) score = 0.6;
                if (score > 0) return { ...repo, score };
                return null;
            })
            .filter(r => r)
            .sort((a,b) => b.score - a.score)
            .slice(0, 20);
    }

    function displayLocalResults(results, query) {
        const container = document.getElementById('local-results');
        if (!results.length) {
            container.innerHTML = '<div style="color:#aaa;">📭 No matching repositories.</div>';
            return;
        }
        container.innerHTML = results.map(r => `
            <div class="result-item" onclick="window.open('${r.url}', '_blank')" style="cursor:pointer;">
                <div class="result-header">
                    <strong>📁 ${r.name}</strong>
                    <span style="color:#5effe0;">${r.language}</span>
                </div>
                <div>⭐ ${r.stars} stars · 📅 ${r.date}</div>
            </div>
        `).join('');
    }

    // ============================================================
    // TRY TO FETCH REAL DATA (background, doesn't block)
    // ============================================================
    async function fetchRealRepos() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            const res = await fetch('https://api.github.com/users/swipswaps/repos?sort=pushed&direction=desc&per_page=50', { signal: controller.signal });
            clearTimeout(timeoutId);
            if (res.ok) {
                const data = await res.json();
                if (data && data.length > 0) {
                    const newRepos = data.map(r => ({
                        name: r.name,
                        language: r.language || 'Unknown',
                        stars: r.stargazers_count || 0,
                        url: r.html_url,
                        date: r.pushed_at ? r.pushed_at.slice(0,10) : '2026-01-01'
                    }));
                    // Only update if different
                    if (JSON.stringify(newRepos) !== JSON.stringify(allRepos)) {
                        allRepos = newRepos;
                        createTagCloud(); // Refresh cloud with real data
                    }
                }
            }
        } catch(e) {
            // Silently keep using MASTER_REPOS
        }
    }

    // ============================================================
    // THREE.JS CLOUD (with proper resource cleanup)
    // ============================================================
    function getLanguageColor(lang) {
        const c = { JavaScript:'#f7df1e', TypeScript:'#3178c6', Python:'#3572A5', Shell:'#89e051', GDScript:'#478cbf', Unknown:'#888', C:'#555555' };
        return c[lang] || '#44aaff';
    }

    function initThreeJS() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.005);
        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 9);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0,0,0);
        
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(2,5,3);
        scene.add(dirLight);
        
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(1500*3);
        for(let i=0;i<1500;i++) { starPos[i*3]=(Math.random()-0.5)*200; starPos[i*3+1]=(Math.random()-0.5)*100; starPos[i*3+2]=(Math.random()-0.5)*80-40; }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xaaccff, size:0.08 }));
        scene.add(stars);
        
        tooltipDiv = document.createElement('div');
        tooltipDiv.style.cssText = 'position:fixed;background:#0a0f1aee;backdrop-filter:blur(12px);color:#e8edf5;padding:8px 16px;border-radius:16px;border-left:3px solid #5effe0;font-size:12px;font-family:monospace;pointer-events:none;z-index:200;display:none;';
        document.body.appendChild(tooltipDiv);
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            stars.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w/h;
            camera.updateProjectionMatrix();
            renderer.setSize(w,h);
        });
    }

    function createTagCloud() {
        // Clean up old resources properly (prevent memory leak)
        tagSprites.forEach(sprite => {
            if (sprite.material && sprite.material.map) sprite.material.map.dispose();
            if (sprite.material) sprite.material.dispose();
            scene.remove(sprite);
        });
        tagSprites = [];
        if(!allRepos.length) return;
        
        const radius = 4.0;
        const golden = (1+Math.sqrt(5))/2;
        allRepos.forEach((repo, idx) => {
            const theta = 2*Math.PI*idx/golden;
            const phi = Math.acos(1 - 2*(idx+0.5)/allRepos.length);
            const x = Math.sin(phi)*Math.cos(theta)*radius;
            const y = Math.sin(phi)*Math.sin(theta)*radius*0.7;
            const z = Math.cos(phi)*radius;
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 110;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0,0,0,canvas.height);
            grad.addColorStop(0,'#1e2438'); grad.addColorStop(1,'#161c2c');
            ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
            const langColor = getLanguageColor(repo.language);
            ctx.strokeStyle = langColor; ctx.lineWidth=3; ctx.strokeRect(5,5,canvas.width-10,canvas.height-10);
            let name = repo.name.length>28 ? repo.name.slice(0,25)+'...' : repo.name;
            ctx.font = `600 ${Math.min(32,22+Math.floor(repo.stars/4))}px system-ui, sans-serif`;
            ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(name, canvas.width/2, canvas.height/2-10);
            ctx.font = '13px monospace'; ctx.fillStyle=langColor;
            ctx.fillText(`${repo.language}  ★ ${repo.stars}`, canvas.width/2, canvas.height/2+22);
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex }));
            sprite.scale.set(2.6,0.6,1); sprite.position.set(x,y,z);
            sprite.userData = { repo };
            scene.add(sprite);
            tagSprites.push(sprite);
        });
        attachInteractionsOnce();
    }

    // Interactions attached ONCE, not on every rebuild
    function attachInteractionsOnce() {
        if (interactionsAttached) return;
        interactionsAttached = true;
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const canvas = renderer.domElement;

        function getRepoFromEvent(clientX, clientY) {
            mouse.x = (clientX / canvas.clientWidth) * 2 - 1;
            mouse.y = -(clientY / canvas.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(tagSprites);
            if (hits.length && hits[0].object.userData?.repo) {
                return hits[0].object.userData.repo;
            }
            return null;
        }

        const onMouseMove = (e) => {
            if (!tagSprites.length) return;
            const repo = getRepoFromEvent(e.clientX, e.clientY);
            if (repo) {
                tooltipDiv.style.display = 'block';
                tooltipDiv.innerHTML = `<strong>${repo.name}</strong><br>📝 ${repo.language}<br>⭐ ${repo.stars}<br>📅 ${repo.date}<br><span style="font-size:10px;">⚡ Tap or click to open</span>`;
                tooltipDiv.style.left = (e.clientX + 15) + 'px';
                tooltipDiv.style.top = (e.clientY + 20) + 'px';
                canvas.style.cursor = 'pointer';
            } else {
                tooltipDiv.style.display = 'none';
                canvas.style.cursor = 'default';
            }
        };

        let pointerDownPos = null, pointerDownTime = 0;
        const onPointerDown = (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = Date.now();
        };
        const onPointerUp = (e) => {
            if (!pointerDownPos) return;
            const dx = Math.abs(e.clientX - pointerDownPos.x);
            const dy = Math.abs(e.clientY - pointerDownPos.y);
            const duration = Date.now() - pointerDownTime;
            if (dx < 10 && dy < 10 && duration < 500) {
                const repo = getRepoFromEvent(e.clientX, e.clientY);
                if (repo && repo.url) window.open(repo.url, '_blank');
            }
            pointerDownPos = null;
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointerup', onPointerUp);
    }

    // ============================================================
    // BACKEND DETECTION (for code search - optional enhancement)
    // ============================================================
    const BACKEND_URL = 'http://localhost:3001';
    let backendOnline = false;

    async function checkBackend() {
        const statusDiv = document.getElementById('backend-status');
        try {
            const res = await fetch(`${BACKEND_URL}/api/health`, { method: 'HEAD', mode: 'cors' });
            if (res.ok) {
                backendOnline = true;
                statusDiv.innerHTML = '<span class="status-badge status-online">✅ Code search backend available</span>';
                document.getElementById('code-query').disabled = false;
                document.getElementById('code-search-btn').disabled = false;
                document.getElementById('instructions-panel').style.display = 'none';
                return;
            }
        } catch(e) {}
        backendOnline = false;
        statusDiv.innerHTML = '<span class="status-badge status-offline">❌ Code search requires local backend (optional)</span>';
        document.getElementById('code-query').disabled = true;
        document.getElementById('code-search-btn').disabled = true;
        document.getElementById('instructions-panel').innerHTML = `
            <div class="instructions">
                <strong>🔬 Advanced Code Search</strong><br>
                <span style="font-size:11px;">To search inside code files (functions, classes, etc.), run the local backend:</span>
                <code>git clone https://github.com/swipswaps/swipswaps-portfolio-showcase.git<br>cd swipswaps-portfolio-showcase<br>npm install<br>npm start</code>
                <span style="font-size:11px;">Then refresh this page. The repo name search above always works.</span>
            </div>
        `;
    }

    async function performCodeSearch() {
        if(!backendOnline) return;
        const query = document.getElementById('code-query').value.trim();
        if(query.length < 2) return;
        const resultsDiv = document.getElementById('code-results');
        resultsDiv.innerHTML = '<div style="color:#88aacc;">🔍 Searching code...</div>';
        try {
            const res = await fetch(`${BACKEND_URL}/api/search-code?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if(data.results && data.results.length) {
                resultsDiv.innerHTML = data.results.map(r => `
                    <div class="result-item">
                        <div class="result-header">
                            <strong>📁 ${r.repo_name}</strong>
                            <span style="color:#5effe0;">${Math.round((r.similarity||0.5)*100)}% match</span>
                        </div>
                        <div><code>${r.file_path}</code> – ${r.chunk_name || 'code'}</div>
                        <div class="code-snippet">${escapeHtml(r.content.substring(0,400))}${r.content.length>400?'…':''}</div>
                    </div>
                `).join('');
            } else {
                resultsDiv.innerHTML = '<div style="color:#aaa;">📭 No matching code. Try "backend", "websocket", or "psutil".</div>';
            }
        } catch(err) {
            resultsDiv.innerHTML = '<div style="color:#ff8888;">⚠️ Backend error. Make sure server is running.</div>';
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================
    initThreeJS();
    createTagCloud();
    
    // Client-side search (repo names only - works everywhere)
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    function doLocalSearch() {
        const query = searchInput.value;
        const results = fuzzySearchRepos(query);
        displayLocalResults(results, query);
    }
    searchBtn.addEventListener('click', doLocalSearch);
    searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') doLocalSearch(); });
    
    // Optional backend code search
    document.getElementById('code-search-btn').addEventListener('click', performCodeSearch);
    document.getElementById('code-query').addEventListener('keypress', (e) => { if(e.key === 'Enter') performCodeSearch(); });
    
    // Fetch real data in background (doesn't block UI)
    fetchRealRepos();
    checkBackend();
</script>
</body>
