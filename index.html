<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>swipswaps · 3D Portfolio Tag Cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #050b1a 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(16px);
            padding: 12px 24px;
            z-index: 100;
            border-bottom: 1px solid rgba(94, 255, 224, 0.2);
        }
        .header h1 { font-size: 1.1rem; font-weight: 600; color: white; }
        .header p { font-size: 0.7rem; color: #88aacc; margin-top: 2px; }
        
        .search-container {
            position: fixed;
            top: 85px;
            left: 24px;
            right: 24px;
            max-width: 380px;
            z-index: 100;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            border: 1px solid rgba(94, 255, 224, 0.3);
            padding: 4px 16px 4px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            padding: 12px 0;
            outline: none;
        }
        .search-container input::placeholder { color: #666; }
        .search-container .search-icon { color: #5effe0; font-size: 18px; }
        .clear-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .clear-btn:hover { background: rgba(255,255,255,0.2); color: white; }
        
        .stats-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            max-width: 380px;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px 20px;
            z-index: 100;
            border: 1px solid rgba(94, 255, 224, 0.2);
        }
        .stats-panel .stats {
            display: flex;
            gap: 24px;
            margin-top: 8px;
            font-size: 12px;
            color: #88aacc;
            font-family: monospace;
        }
        .badge {
            background: rgba(94, 255, 224, 0.15);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            color: #5effe0;
        }
        
        .controls-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            color: #888;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        
        .social-links {
            position: fixed;
            top: 12px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        .social-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
            background: rgba(8, 12, 20, 0.8);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .social-links a:hover { color: #5effe0; border-color: #5effe0; }
        
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 16px 32px;
            border-radius: 60px;
            color: #5effe0;
            font-family: monospace;
            z-index: 200;
            border: 1px solid #5effe0;
        }
        
        @media (max-width: 700px) {
            .header { padding: 8px 16px; }
            .header h1 { font-size: 0.9rem; }
            .search-container { top: 75px; left: 16px; right: 16px; max-width: none; }
            .stats-panel { left: 16px; right: 16px; max-width: none; bottom: 16px; }
            .social-links { top: 8px; right: 16px; }
            .social-links a { padding: 5px 12px; font-size: 11px; }
        }
        
        canvas { display: block; }
        
        .tag-tooltip {
            position: fixed;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            color: #5effe0;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 200;
            border: 1px solid #5effe0;
            white-space: nowrap;
            transform: translate(-50%, -120%);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>José Melendez</h1>
        <p>DevOps Data Scientist · AI-Augmented Reliability Engineer</p>
    </div>
    <div class="social-links">
        <a href="https://github.com/swipswaps" target="_blank">GitHub</a>
        <a href="https://x.com/swipswaps" target="_blank">X/Twitter</a>
    </div>
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Filter repositories by name..." autocomplete="off">
        <button class="clear-btn" id="clear-search" style="display: none;">✕</button>
    </div>
    <div class="stats-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <span style="font-weight: 600; color: #5effe0;">✨ swipswaps Portfolio</span>
            <span class="badge" id="data-badge">Loading...</span>
        </div>
        <div class="stats">
            <span>📦 <span id="total-count">—</span> repos</span>
            <span>⭐ <span id="star-count">—</span> stars</span>
            <span>🎯 <span id="visible-count">—</span> visible</span>
        </div>
    </div>
    <div class="controls-hint">🖱️ Drag to rotate • Hover for info • Click to open</div>
    <div id="loader">🌀 loading 3D tag cloud...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        let allRepos = [];
        let currentFilter = '';
        let scene, camera, renderer, controls;
        let tagObjects = [];
        let tooltipDiv;
        
        // ============================================================
        // FALLBACK DATA - Your actual repositories
        // ============================================================
        const FALLBACK_REPOS = [
            { name: "observability-platform", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/observability-platform", date: "2026-05-18" },
            { name: "vscode-llm-multi-provider", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/vscode-llm-multi-provider", date: "2026-05-20" },
            { name: "callback-platform", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/callback-platform", date: "2026-05-15" },
            { name: "firefox_fix", language: "Shell", stars: 0, url: "https://github.com/swipswaps/firefox_fix", date: "2026-05-14" },
            { name: "ice-tuner", language: "Python", stars: 0, url: "https://github.com/swipswaps/ice-tuner", date: "2026-05-12" },
            { name: "conversation-search", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/conversation-search", date: "2026-05-10" },
            { name: "Master-FB", language: "Python", stars: 0, url: "https://github.com/swipswaps/Master-FB", date: "2026-05-08" },
            { name: "balloon-color-plan", language: "JavaScript", stars: 0, url: "https://github.com/swipswaps/balloon-color-plan", date: "2026-05-07" },
            { name: "lossless-ffmpeg-concat", language: "Shell", stars: 0, url: "https://github.com/swipswaps/lossless-ffmpeg-concat", date: "2026-05-05" },
            { name: "Masterclass-TUI", language: "Python", stars: 0, url: "https://github.com/swipswaps/Masterclass-TUI", date: "2026-05-03" },
            { name: "controller-Unified", language: "C", stars: 0, url: "https://github.com/swipswaps/controller-Unified", date: "2026-05-01" },
            { name: "parachute-cfd-game", language: "GDScript", stars: 0, url: "https://github.com/swipswaps/parachute-cfd-game", date: "2026-04-28" },
            { name: "deterministic-Network", language: "Python", stars: 0, url: "https://github.com/swipswaps/deterministic-Network", date: "2026-04-25" },
            { name: "bcm4331-folder", language: "Shell", stars: 0, url: "https://github.com/swipswaps/bcm4331-folder", date: "2026-04-22" },
            { name: "Video-Insight-Server", language: "Python", stars: 0, url: "https://github.com/swipswaps/Video-Insight-Server", date: "2026-04-20" },
            { name: "Pro-Vista", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/Pro-Vista", date: "2026-04-18" },
            { name: "GEMMA_4", language: "Python", stars: 0, url: "https://github.com/swipswaps/GEMMA_4", date: "2026-04-15" },
            { name: "sys-inspector", language: "Python", stars: 0, url: "https://github.com/swipswaps/sys-inspector", date: "2026-04-12" },
            { name: "storyboard-studio", language: "TypeScript", stars: 0, url: "https://github.com/swipswaps/storyboard-studio", date: "2026-04-10" }
        ];
        
        async function fetchRepos() {
            const loader = document.getElementById('loader');
            try {
                const response = await fetch('https://api.github.com/users/swipswaps/repos?sort=pushed&direction=desc&per_page=50');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        allRepos = data.map(repo => ({
                            name: repo.name,
                            language: repo.language || 'Unknown',
                            stars: repo.stargazers_count || 0,
                            url: repo.html_url,
                            date: repo.pushed_at.slice(0, 10)
                        }));
                        document.getElementById('data-badge').textContent = '✓ Live GitHub API';
                        document.getElementById('data-badge').style.color = '#5effe0';
                        if (loader) loader.style.display = 'none';
                        updateStats();
                        createTagCloud();
                        return;
                    }
                }
                throw new Error('API failed');
            } catch (err) {
                console.log('Using fallback data');
                allRepos = [...FALLBACK_REPOS];
                document.getElementById('data-badge').textContent = '📦 Sample Data';
                document.getElementById('data-badge').style.color = '#ffaa44';
                if (loader) loader.style.display = 'none';
                updateStats();
                createTagCloud();
            }
        }
        
        function updateStats() {
            document.getElementById('total-count').textContent = allRepos.length;
            const totalStars = allRepos.reduce((sum, r) => sum + (r.stars || 0), 0);
            document.getElementById('star-count').textContent = totalStars;
        }
        
        function getLanguageColor(lang) {
            const colors = {
                'JavaScript': '#f7df1e', 'TypeScript': '#3178c6', 'Python': '#3572A5',
                'Shell': '#89e051', 'HTML': '#e34c26', 'CSS': '#563d7c',
                'GDScript': '#478cbf', 'Go': '#00ADD8', 'Rust': '#dea584',
                'C': '#555555', 'Unknown': '#888888'
            };
            return colors[lang] || '#44aaff';
        }
        
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050b1a);
            scene.fog = new THREE.FogExp2(0x050b1a, 0.003);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 14);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.enableZoom = true;
            controls.zoomSpeed = 1.0;
            controls.rotateSpeed = 1.0;
            controls.target.set(0, 0, 0);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(2, 5, 3);
            scene.add(directionalLight);
            const backLight = new THREE.PointLight(0x4488ff, 0.5);
            backLight.position.set(-2, 1, -4);
            scene.add(backLight);
            
            // Starfield
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 1500;
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starPositions[i*3] = (Math.random() - 0.5) * 200;
                starPositions[i*3+1] = (Math.random() - 0.5) * 100;
                starPositions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.1 }));
            scene.add(stars);
            
            // Tooltip
            tooltipDiv = document.createElement('div');
            tooltipDiv.className = 'tag-tooltip';
            tooltipDiv.style.display = 'none';
            document.body.appendChild(tooltipDiv);
            
            // Animation
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                stars.rotation.y += 0.0005;
                renderer.render(scene, camera);
            }
            animate();
            
            window.addEventListener('resize', onWindowResize);
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        // ============================================================
        // FIXED: Raycaster for click detection - works with OrbitControls
        // Source: Three.js Raycaster documentation
        // URL: https://threejs.org/docs/#api/en/core/Raycaster
        // ============================================================
        
        function setupEventListeners() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            // Mouse move for tooltips
            window.addEventListener('mousemove', (event) => {
                if (!tagObjects.length) return;
                
                mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
                mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(tagObjects);
                
                if (intersects.length > 0) {
                    const repo = intersects[0].userData.repo;
                    if (repo) {
                        tooltipDiv.style.display = 'block';
                        tooltipDiv.innerHTML = `<strong>${repo.name}</strong><br>${repo.language} ★ ${repo.stars}<br>📅 ${repo.date}`;
                        tooltipDiv.style.left = event.clientX + 15 + 'px';
                        tooltipDiv.style.top = event.clientY - 40 + 'px';
                        document.body.style.cursor = 'pointer';
                    }
                } else {
                    tooltipDiv.style.display = 'none';
                    document.body.style.cursor = 'default';
                }
            });
            
            // Click handler - FIXED: uses same raycasting logic
            window.addEventListener('click', (event) => {
                if (!tagObjects.length) return;
                
                mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
                mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(tagObjects);
                
                if (intersects.length > 0) {
                    const repo = intersects[0].userData.repo;
                    if (repo && repo.url) {
                        console.log('Opening:', repo.url);
                        window.open(repo.url, '_blank');
                    }
                }
            });
        }
        
        function createTagCloud() {
            // Remove old tags
            tagObjects.forEach(obj => {
                if (scene) scene.remove(obj);
            });
            tagObjects = [];
            
            // Filter repos
            let filteredRepos = allRepos;
            if (currentFilter) {
                filteredRepos = allRepos.filter(repo => 
                    repo.name.toLowerCase().includes(currentFilter.toLowerCase())
                );
            }
            document.getElementById('visible-count').textContent = filteredRepos.length;
            
            if (filteredRepos.length === 0) {
                return;
            }
            
            const radius = 5.5;
            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            
            filteredRepos.forEach((repo, idx) => {
                // Fibonacci sphere distribution
                const theta = 2 * Math.PI * idx / goldenRatio;
                const phi = Math.acos(1 - 2 * (idx + 0.5) / filteredRepos.length);
                
                const x = Math.sin(phi) * Math.cos(theta) * radius;
                const y = Math.sin(phi) * Math.sin(theta) * radius * 0.8;
                const z = Math.cos(phi) * radius;
                
                // Canvas texture
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 128;
                
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const langColor = getLanguageColor(repo.language);
                ctx.strokeStyle = langColor;
                ctx.lineWidth = 3;
                ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
                
                let displayName = repo.name;
                if (displayName.length > 25) {
                    displayName = displayName.slice(0, 22) + '...';
                }
                
                ctx.font = `Bold ${Math.min(32, 24 + Math.floor(repo.stars / 5))}px 'Inter', system-ui`;
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(displayName, canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = '14px monospace';
                ctx.fillStyle = langColor;
                ctx.fillText(`${repo.language}  ★ ${repo.stars}`, canvas.width / 2, canvas.height / 2 + 25);
                
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(2.6, 0.7, 1);
                sprite.position.set(x, y, z);
                sprite.userData = { repo: repo };
                
                scene.add(sprite);
                tagObjects.push(sprite);
            });
            
            // Re-setup event listeners after cloud creation
            setupEventListeners();
        }
        
        // Search functionality
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        
        searchInput.addEventListener('input', (e) => {
            currentFilter = e.target.value;
            clearBtn.style.display = currentFilter ? 'block' : 'none';
            createTagCloud();
        });
        
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentFilter = '';
            clearBtn.style.display = 'none';
            createTagCloud();
        });
        
        // Initialize
        initThreeJS();
        fetchRepos();
    </script>
</body>
</html>
