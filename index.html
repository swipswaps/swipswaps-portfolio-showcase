<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>swipswaps · 3D Repository Timeline Word Cloud</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        /* UI Overlay Panel */
        #info-panel {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px 24px;
            color: #f0f3fa;
            border: 1px solid rgba(0, 255, 200, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }
        
        #info-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #7effe0;
            letter-spacing: -0.2px;
        }
        
        #info-desc {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .badge-date {
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 2px 8px;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 6px;
            color: #aaa;
        }
        
        .controls-note {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #ccc;
            font-family: monospace;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 10;
        }
        
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 40px;
            color: #7effe0;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.5s ease;
            border: 1px solid rgba(0,255,200,0.3);
        }
        
        a {
            color: #7effe0;
            text-decoration: none;
            pointer-events: auto;
        }
        
        @media (max-width: 700px) {
            #info-panel { padding: 12px 18px; bottom: 16px; left: 16px; right: 16px; }
            #info-title { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div id="info-panel">
        <div id="info-title">✨ swipswaps · AI Reliability Engineer</div>
        <div id="info-desc">Hover over glowing word bubbles → each represents a repo organized by date. Click to open GitHub.</div>
        <div class="badge-date" id="date-badge">🗓️ Loading repository data...</div>
    </div>
    <div class="controls-note">🖱️ Drag to orbit • Scroll to zoom</div>
    <div id="loader">🌀 loading 3D word cloud from GitHub API...</div>

    <!-- 
      CITATION: Import map for bare module specifiers
      Source: MDN <script type="importmap">
      Verbatim quote: "used to resolve module specifiers in static and dynamic imports"
      URL: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/script/type/importmap
    -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // --------------------------------------------------------------
        // THREE.JS REPOSITORY TIMELINE WORD CLOUD
        // --------------------------------------------------------------
        // WHAT:    3D visualization of GitHub repositories arranged by last push date
        // WHY:     Visualize project evolution and activity over time in an immersive space
        // MENTAL MODEL: Each repo becomes a glowing sphere + CSS2D label. Depth (Z-axis) = recency
        //              (older repos further back, newer repos forward). Color indicates language/type.
        //              Floating particles and rings represent "observability/data flow" theme.
        // FAILURE MODE: If GitHub API rate-limits (60/hr unauthenticated), falls back to repos.json
        // VERIFIES WITH: python3 -m http.server 8000 → localhost:8000, inspect network tab
        // --------------------------------------------------------------
        
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        
        // --------------------------------------------------------------
        // DATA FETCHING: Live from GitHub API + local fallback
        // --------------------------------------------------------------
        // CITATION: GitHub API unauthenticated rate limit = 60 requests/hour
        // Source: GitHub Docs
        // Verbatim quote: "the primary rate limit for unauthenticated requests is 60 requests per hour"
        // URL: https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api
        const GITHUB_USER = 'swipswaps';
        const API_URL = `https://api.github.com/users/${GITHUB_USER}/repos?sort=pushed&direction=desc&per_page=100`;
        const FALLBACK_URL = 'repos.json';
        
        let repositories = [];
        let usingLiveData = false;
        
        async function fetchRepos() {
            const loader = document.getElementById('loader');
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        repositories = data.map(repo => ({
                            name: repo.name,
                            pushed_at: repo.pushed_at,
                            stargazers_count: repo.stargazers_count || 0,
                            language: repo.language || 'Unknown',
                            html_url: repo.html_url,
                            description: repo.description || ''
                        }));
                        usingLiveData = true;
                        if (loader) loader.style.opacity = '0';
                        setTimeout(() => { if(loader) loader.remove(); }, 800);
                        document.getElementById('date-badge').innerHTML = '✅ Live GitHub API · ' + repositories.length + ' repos';
                        return;
                    }
                }
                throw new Error(`API returned ${response.status}`);
            } catch (err) {
                console.warn('GitHub API failed, loading fallback data:', err);
                // Fallback to bundled repos.json
                const fallbackResp = await fetch(FALLBACK_URL);
                const fallbackData = await fallbackResp.json();
                repositories = fallbackData;
                usingLiveData = false;
                if (loader) loader.style.opacity = '0';
                setTimeout(() => { if(loader) loader.remove(); }, 800);
                document.getElementById('date-badge').innerHTML = '📦 Sample data (API rate-limited) · ' + repositories.length + ' repos';
            }
        }
        
        // --------------------------------------------------------------
        // SCENE SETUP
        // --------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 12);
        camera.lookAt(0, 0, -1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // CITATION: devicePixelRatio cap at 2 for performance
        // Source: MDN Window.devicePixelRatio
        // Verbatim quote: "ratio of the resolution in physical pixels to the resolution in CSS pixels"
        // URL: https://developer.mozilla.org/en-US/docs/Web/API/Window/devicePixelRatio
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // CSS2 renderer for crisp text labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        // CITATION: pointer-events: none allows orbit-drag through label layer
        // Source: MDN pointer-events
        // Verbatim quote: "never the target of pointer events"
        // URL: https://developer.mozilla.org/en-US/docs/Web/CSS/pointer-events
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // OrbitControls with damping
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0.5, 0);
        
        // --------------------------------------------------------------
        // ENVIRONMENT: Grid, lights, decorative elements
        // --------------------------------------------------------------
        const gridHelper = new THREE.GridHelper(25, 30, 0x44aaff, 0x226699);
        gridHelper.position.y = -2.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        const ambient = new THREE.AmbientLight(0x222222);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(2, 5, 3);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x2266ff, 0.4);
        fillLight.position.set(-2, 1, 4);
        scene.add(fillLight);
        
        // Starfield background
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1200;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 60;
            starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 30;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12, transparent: true, opacity: 0.5 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // Decorative rings
        const ringGeo = new THREE.TorusGeometry(3.5, 0.08, 64, 300);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x33ddcc, emissive: 0x118877, emissiveIntensity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -1;
        scene.add(ring);
        
        const innerRing = new THREE.TorusGeometry(2.2, 0.05, 48, 200);
        const innerMat = new THREE.MeshStandardMaterial({ color: 0xff77aa, emissive: 0x331122 });
        const ring2 = new THREE.Mesh(innerRing, innerMat);
        ring2.rotation.z = Math.PI / 3;
        ring2.rotation.x = 1.2;
        ring2.position.y = 0.2;
        scene.add(ring2);
        
        // Central core (self-healing / AI symbol)
        const coreGlow = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.85, 1),
            new THREE.MeshStandardMaterial({ color: 0x77ffdd, emissive: 0x33bbaa, emissiveIntensity: 1.2, roughness: 0.2 })
        );
        coreGlow.position.set(0, 0.2, -1.2);
        scene.add(coreGlow);
        
        // Floating particles around core
        const particleRing = new THREE.Points(
            new THREE.BufferGeometry(),
            new THREE.PointsMaterial({ color: 0x88ffcc, size: 0.08 })
        );
        const partCount = 400;
        const partPositions = [];
        for (let i = 0; i < partCount; i++) {
            const angle = (i / partCount) * Math.PI * 2;
            const radius = 1.4;
            partPositions.push(Math.cos(angle) * radius, Math.sin(angle) * radius + 0.2, -1.2);
        }
        particleRing.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(partPositions), 3));
        scene.add(particleRing);
        
        // Dust particles for observability theme
        const dustCount = 800;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPositions[i*3] = (Math.random() - 0.5) * 18;
            dustPositions[i*3+1] = (Math.random() - 0.5) * 8;
            dustPositions[i*3+2] = (Math.random() - 0.5) * 20 - 5;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0x77bbff, size: 0.05, transparent: true, opacity: 0.4 });
        const dustSystem = new THREE.Points(dustGeo, dustMat);
        scene.add(dustSystem);
        
        // --------------------------------------------------------------
        // WORD CLOUD CREATION (after data loads)
        // --------------------------------------------------------------
        let wordGroup = [];
        let clickableObjects = [];
        const cloudContainer = new THREE.Group();
        scene.add(cloudContainer);
        
        function getLanguageColor(lang) {
            const colors = {
                'JavaScript': '#f1e05a', 'TypeScript': '#3178c6', 'Python': '#3572A5',
                'Shell': '#89e051', 'HTML': '#e34c26', 'CSS': '#563d7c',
                'Go': '#00ADD8', 'Rust': '#dea584', 'Unknown': '#888888'
            };
            return colors[lang] || '#44aaff';
        }
        
        function createWordCloud() {
            if (!repositories.length) return;
            
            // Sort by date for timeline Z positioning
            const sorted = [...repositories].sort((a,b) => 
                new Date(a.pushed_at) - new Date(b.pushed_at)
            );
            
            const minDate = new Date(sorted[0].pushed_at);
            const maxDate = new Date(sorted[sorted.length-1].pushed_at);
            const dateRange = maxDate - minDate;
            
            // Guard against division by zero (all repos same date)
            const rangeSafe = dateRange === 0 ? 1 : dateRange;
            
            sorted.forEach((repo, idx) => {
                // Timeline Z: older repos back, newer repos forward
                const t = (new Date(repo.pushed_at) - minDate) / rangeSafe;
                const posZ = -7 + (t * 13);
                
                // X position: golden-angle spiral distribution
                // CITATION: Vogel's phyllotaxis model for uniform spherical distribution
                // Source: Vogel, H (1979). "A better way to construct the sunflower head"
                // Mathematical Biosciences, Tier 1 academic reference
                const goldenAngle = Math.PI * (3 - Math.sqrt(5));
                const theta = idx * goldenAngle;
                const radius = 3.8 * Math.sqrt(idx / sorted.length);
                const posX = Math.cos(theta) * radius;
                const posY = Math.sin(theta) * 1.2 + (Math.sin(idx * 0.5) * 0.4);
                
                const repoColor = getLanguageColor(repo.language);
                const starBonus = Math.min(0.3, Math.log10(repo.stargazers_count + 1) * 0.08);
                const scaleVal = 0.85 + t * 0.5 + starBonus;
                
                // Glowing sphere
                const sphereMat = new THREE.MeshStandardMaterial({
                    color: repoColor,
                    emissive: repoColor,
                    emissiveIntensity: 0.35,
                    roughness: 0.3,
                    metalness: 0.7,
                    transparent: true,
                    opacity: 0.7
                });
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(scaleVal * 0.45, 32, 32), sphereMat);
                sphere.position.set(posX, posY, posZ);
                sphere.userData = { repo, type: 'repo' };
                cloudContainer.add(sphere);
                clickableObjects.push(sphere);
                
                // CSS2D Label
                const div = document.createElement('div');
                div.textContent = repo.name;
                div.style.color = '#ffffff';
                div.style.fontSize = `${Math.floor(14 + scaleVal * 7)}px`;
                div.style.fontWeight = '600';
                div.style.fontFamily = "'Inter', system-ui, monospace";
                div.style.textShadow = `0 0 8px ${repoColor}`;
                div.style.background = `rgba(0, 0, 0, 0.7)`;
                div.style.padding = '6px 14px';
                div.style.borderRadius = '40px';
                div.style.borderLeft = `3px solid ${repoColor}`;
                div.style.backdropFilter = 'blur(8px)';
                div.style.transition = 'all 0.2s ease';
                div.style.cursor = 'pointer';
                div.style.whiteSpace = 'nowrap';
                div.style.letterSpacing = '-0.2px';
                div.style.pointerEvents = 'auto';
                
                div.addEventListener('mouseenter', () => {
                    div.style.background = `rgba(30, 40, 70, 0.95)`;
                    div.style.transform = `scale(1.02)`;
                    document.getElementById('info-title').innerHTML = `📁 ${repo.name}`;
                    document.getElementById('info-desc').innerHTML = `${repo.language} · ⭐ ${repo.stargazers_count}<br>📅 ${repo.pushed_at.slice(0,10)}<br>🔗 Click to open GitHub`;
                    document.getElementById('date-badge').innerHTML = `🗓️ ${repo.pushed_at.slice(0,10)} · ${repo.language}`;
                });
                
                div.addEventListener('mouseleave', () => {
                    div.style.background = `rgba(0, 0, 0, 0.7)`;
                    div.style.transform = `scale(1)`;
                });
                
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(repo.html_url, '_blank');
                });
                
                const label = new CSS2DObject(div);
                label.position.set(posX, posY + scaleVal * 0.4, posZ);
                cloudContainer.add(label);
                
                wordGroup.push({ sphere, label, repo, posX, posY, posZ, scale: scaleVal, color: repoColor });
            });
            
            // Add connecting timeline lines
            const points3d = wordGroup.map(w => new THREE.Vector3(w.posX, w.posY, w.posZ));
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.3 });
            for (let i = 0; i < points3d.length - 1; i++) {
                const geometry = new THREE.BufferGeometry().setFromPoints([points3d[i], points3d[i+1]]);
                const line = new THREE.Line(geometry, lineMaterial);
                cloudContainer.add(line);
            }
        }
        
        // --------------------------------------------------------------
        // ANIMATION LOOP
        // --------------------------------------------------------------
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;
            
            // Bobbing animation for word cloud
            wordGroup.forEach((item, i) => {
                const bobY = Math.sin(time * 1.2 + i) * 0.03;
                const bobX = Math.sin(time * 0.9 + i * 0.7) * 0.02;
                item.sphere.position.y = item.posY + bobY;
                item.sphere.position.x = item.posX + bobX;
                item.label.position.y = item.posY + item.scale * 0.4 + bobY;
                item.label.position.x = item.posX + bobX;
            });
            
            // Rotate decorative elements
            coreGlow.rotation.x += 0.005;
            coreGlow.rotation.y += 0.008;
            particleRing.rotation.z += 0.01;
            ring.rotation.z += 0.002;
            ring2.rotation.x += 0.003;
            ring2.rotation.y += 0.004;
            stars.rotation.y -= 0.0002;
            dustSystem.rotation.y += 0.0005;
            dustSystem.rotation.x += 0.0003;
            
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        // Bootstrap
        await fetchRepos();
        createWordCloud();
        animate();
        
        // Resize handler
        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
