<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Dashboard · swipswaps</title>
    <style>
        body {
            background: #0a0f1a;
            font-family: 'Inter', monospace;
            padding: 40px;
            color: #e8edf5;
        }
        h1 { color: #5effe0; margin-bottom: 20px; }
        .error-table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
        }
        .error-table th, .error-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a3e;
        }
        .error-table th {
            background: #252540;
            color: #5effe0;
        }
        .error-table tr:hover {
            background: #252540;
        }
        .critical { color: #ff6644; font-weight: bold; }
        .recent { color: #ffaa44; }
        .old { color: #88aacc; }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            border-left: 3px solid #5effe0;
            min-width: 150px;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #5effe0;
        }
        button {
            background: #5effe0;
            color: #0a0f1a;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.8; }
        .resolve-btn {
            background: #2a2a3e;
            color: #5effe0;
            border: 1px solid #5effe0;
        }
    </style>
</head>
<body>
    <h1>📊 Console Error Dashboard</h1>
    <div class="stats" id="stats"></div>
    <table class="error-table" id="error-table">
        <thead>
            <tr><th>Time</th><th>Type</th><th>Message</th><th>URL</th><th>Action</th></tr>
        </thead>
        <tbody id="error-list"></tbody>
    </table>
    
    <script>
        async function loadErrors() {
            const response = await fetch('/api/unresolved-errors');
            const errors = await response.json();
            
            const tbody = document.getElementById('error-list');
            tbody.innerHTML = errors.map(e => `
                <tr>
                    <td>${new Date(e.created_at).toLocaleString()}</td>
                    <td><span class="${e.severity.toLowerCase()}">${e.error_type || 'Error'}</span></td>
                    <td style="max-width:400px; overflow-x:auto;">${e.error_message}</td>
                    <td>${e.url ? new URL(e.url).pathname : '-'}</td>
                    <td><button class="resolve-btn" onclick="resolveError('${e.id}')">✓ Resolve</button></td>
                </tr>
            `).join('');
            
            // Load stats
            const statsResp = await fetch('/api/error-stats?days=7');
            const stats = await statsResp.json();
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = `
                <div class="stat-card"><div class="number">${stats.reduce((s,e)=>s+e.count,0)}</div><div>Total Errors (7d)</div></div>
                <div class="stat-card"><div class="number">${stats.filter(s => s.error_type === 'ConsoleError').reduce((s,e)=>s+e.count,0)}</div><div>Console Errors</div></div>
                <div class="stat-card"><div class="number">${stats.filter(s => s.severity === 'Critical').reduce((s,e)=>s+e.count,0)}</div><div>Critical (last hour)</div></div>
            `;
        }
        
        async function resolveError(id) {
            await fetch(`/api/resolve-error/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ notes: 'Resolved via dashboard' })
            });
            loadErrors();
        }
        
        loadErrors();
        setInterval(loadErrors, 30000); // Refresh every 30 seconds
    </script>
</body>
</html>
